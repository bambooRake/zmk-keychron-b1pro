CONFIG_USB_DEVICE_PRODUCT="B1Pro Lala DBG"
CONFIG_BT_DIS_MODEL="B1Pro Lala DBG"
CONFIG_ZMK_KEYBOARD_NAME="B1Pro Lala DBG"

# Force kscan into polling mode + add settling waits. The interrupt-driven
# matrix scan in this fork mis-reads (row, col) intermittently on B1 Pro,
# producing wrong-key / no-key outputs even with a minimal &kp keymap.
# Polling with explicit settle times restores stable scan results.
CONFIG_ZMK_KSCAN_MATRIX_POLLING=y
CONFIG_ZMK_KSCAN_MATRIX_WAIT_BETWEEN_OUTPUTS=10
CONFIG_ZMK_KSCAN_MATRIX_WAIT_BEFORE_INPUTS=10

CONFIG_USB_DEVICE_VID=0x3434
CONFIG_USB_DEVICE_PID=0x0713
CONFIG_BT_DIS_PNP_VID=0x3434
CONFIG_BT_DIS_PNP_PID=0x0713
CONFIG_BT_DIS_FW_REV_STR="v1.0.4"
CONFIG_BT_DIS_HW_REV_STR="v1.0.0"
CONFIG_BT_DIS_SERIAL_NUMBER_STR="SN2024040814230078"

# Note: CONFIG_ZMK_LAUNCHER stays enabled (default y). The launcher
# infrastructure is too tightly integrated to disable cleanly. Instead
# we patch set_zmk_keymap() in app/src/launcher/map_keycode.c to be a
# no-op so EEPROM-stored VIA keycodes can never overwrite our static
# zmk_keymap[]. See app/src/launcher_stubs.c -- those stubs are only
# active if CONFIG_ZMK_LAUNCHER becomes n at some point.